<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="text-scale" content="scale" />

    <title>Unique page title - My Site</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="public/img/favicon.ico" />

    <meta name="description" content="Page description" />

    <script src="app.js" defer></script>
  </head>

  <body>
    <main>
      <section class="chatbot">
        <div class="overskrift">
          <h1>Chatbot</h1>
        </div>
        <div class="svar">
          <section id="messages" class="message-block"></section>
        </div>

        <div class="gameboy">
          <form class="ryd">
            <button type="submit" id="clear-messages-button">
              Ryd historik
            </button>
          </form>
          <div>
            <form
              class="spørgsmål"
              id="question-form"
              method="POST"
              action="/ask"
            >
              <input
                type="text"
                id="question"
                name="question"
                placeholder="Skriv dit spørgsmål her:"
              />
              <div class="input-højre">
                <div class="char-counter">
                  <span id="char-count">0</span>/280
                </div>
                <button type="submit">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M4 19h4v2H2v-8h2v6Zm8 0H8v-2h4v2Zm4-2h-4v-2h4v2Zm4-2h-4v-2h4v2Zm-10-2H4v-2h6v2Zm12 0h-2v-2h2v2ZM8 5H4v6H2V3h6v2Zm12 6h-4V9h4v2Zm-4-2h-4V7h4v2Zm-4-2H8V5h4v2Z"
                    />
                  </svg>
                </button>
              </div>
            </form>
          </div>
        </div>
        <?xml version="1.0" encoding="UTF-8"?>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
